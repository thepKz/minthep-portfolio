# Route + link verification for minthep-portfolio.
#
# This workflow is DELIBERATELY INDEPENDENT of "Deploy static content to Pages"
# (.github/workflows/static.yml). It has no `needs:` and shares no concurrency
# group with it, so a bug in this checker can never stop the site from shipping.
# It reports; it does not gate.
#
# It runs on ubuntu-latest on purpose: GitHub Pages serves from a case-sensitive
# filesystem, and so does this runner. The author's Mac does not. Check B only
# means something here.

name: Verify routes and links

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  routes:
    name: Route, case and link verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Zero dependencies by design — there is no build step in this repo and
      # `npm install` must never become one. The script is plain Node ESM.
      - name: Check routes, links, case-exactness and CSS literals
        run: node tools/check-routes.mjs
